[package]
name = "orbit-ide"
version = "1.0.0"
description = "Orbit: an IDE for building iOS and Android apps"
authors = ["Rishabh Verma"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "orbit_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
tauri-plugin-dialog = "2.8.2"
tokio = { version = "1.53.2", features = ["process", "io-util", "rt", "macros", "sync", "time", "net"] }
ignore = "0.4.33"
regex = "1.13.1"
trash = "5.2.9"
notify-debouncer-mini = "0.7.0"
libc = "0.2"
reqwest = { version = "0.13", features = ["json"] }
sha2 = "0.11"
tauri-plugin-updater = "2.13.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
